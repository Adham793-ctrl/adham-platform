<!DOCTYPE html>
<html lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Adham Platform</title>

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#020617,#0f172a);
  color:white;
  text-align:center;
  font-family:Tahoma;
}

/* دخول */
.start-btn{
  margin-top:200px;
  padding:15px 35px;
  font-size:18px;
  border:none;
  border-radius:15px;
  background:#00f7ff;
  color:black;
  box-shadow:0 0 25px #00f7ff;
  cursor:pointer;
  transition:0.3s;
}
.start-btn:hover{
  transform:scale(1.1);
}

/* الصفحة */
#home{display:none; animation:fade 1s;}
@keyframes fade{
  from{opacity:0;}
  to{opacity:1;}
}

/* عنوان */
.glow{
  text-shadow:0 0 10px #00f7ff,0 0 30px #00f7ff;
}

/* الصور */
.triangle{
  position:relative;
  width:300px;
  margin:40px auto;
}
.triangle img{
  width:110px;
  border-radius:15px;
  position:absolute;
  transition:0.4s;
}
.triangle img:hover{
  transform:scale(1.1) rotate(5deg);
}
.img1{top:0;left:0;}
.img2{top:0;right:0;}
.img3{top:120px;left:50%;transform:translateX(-50%);}

/* المطور */
.dev{
  margin-top:160px;
  font-size:18px;
}

/* الأزرار */
.btn{
  display:block;
  width:85%;
  margin:10px auto;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#0ea5e9;
  color:white;
  box-shadow:0 0 15px #0ea5e9;
  cursor:pointer;
  transition:0.3s;
}
.btn:hover{
  box-shadow:0 0 35px #00f7ff;
  transform:scale(1.05);
}

/* البوكس */
.box{
  display:none;
  background:#111827;
  padding:15px;
  border-radius:15px;
  width:85%;
  margin:auto;
  box-shadow:0 0 20px #00f7ff;
  animation:fade 0.5s;
}

/* زر رجوع */
.back{
  background:#ef4444;
  box-shadow:0 0 15px red;
}

/* الفوتر */
.footer{
  font-size:12px;
  text-align:center;
  margin:30px;
  opacity:0.7;
}
</style>
</head>

<body>

<div id="login">
  <button class="start-btn" onclick="enter()">🚀 دخول المنصة</button>
</div>

<div id="home">

<h2 class="glow">✨ منصة أدهم الاحترافية ✨</h2>

<div class="triangle">
  <img class="img1" src="https://i.imgur.com/6VBx3io.png">
  <img class="img2" src="https://i.imgur.com/6VBx3io.png">
  <img class="img3" src="https://i.imgur.com/6VBx3io.png">
</div>

<p class="dev">👨‍💻 Developer Adham</p>

<button class="btn" onclick="toggle('bots')">🤖 بوتات واتس</button>
<div class="box" id="bots">
  <button class="btn" onclick="openLink('https://chat.whatsapp.com/KC8Q6P7Z9RI25uGYHMMMV3')">جروب 1</button>
  <button class="btn" onclick="openLink('https://chat.whatsapp.com/K5oCXsm3AvuLezbArdHOa2')">جروب 2</button>
  <button class="btn back" onclick="hideAll()">⬅ رجوع</button>
</div>

<button class="btn" onclick="toggle('crash')">💀 بوتات كراش</button>
<div class="box" id="crash">
  <button class="btn" onclick="openLink('https://t.me/hfggbjbot')">كراش 1</button>
  <button class="btn" onclick="openLink('https://t.me/GAZARA_B_BOT')">كراش 2</button>
  <button class="btn" onclick="openLink('https://t.me/A_d_h_a_m3bot')">كراش 3</button>
  <button class="btn back" onclick="hideAll()">⬅ رجوع</button>
</div>

<button class="btn" onclick="toggle('channels')">📺 القنوات</button>
<div class="box" id="channels">
  <button class="btn" onclick="openLink('https://whatsapp.com/channel/0029VbCkwWWEAKWKOCl2Os3E')">قناة 1</button>
  <button class="btn" onclick="openLink('https://whatsapp.com/channel/0029VbBk7J059PwUGXv60o16')">قناة 2</button>
  <button class="btn" onclick="openLink('https://t.me/D_l_L_s_k_H_6')">تيليجرام</button>
  <button class="btn back" onclick="hideAll()">⬅ رجوع</button>
</div>

<button class="btn" onclick="toggle('prices')">💰 الأسعار</button>
<div class="box" id="prices">
  <p>💻 منصة 32 رام: 600 جنيه</p>
  <p>⚡ استضافة: 200 - 450</p>
  <p>🖥️ سيرفر محدود: 30 - 70</p>
  <p>🔥 سيرفر مفتوح: 80</p>
  <button class="btn back" onclick="hideAll()">⬅ رجوع</button>
</div>

<button class="btn" onclick="toggle('devbox')">👨‍💻 المطور</button>
<div class="box" id="devbox">
  <button class="btn" onclick="openLink('https://wa.me/201014962157')">شراء</button>
  <button class="btn" onclick="openLink('https://wa.me/201090656418')">استفسار</button>
  <button class="btn" onclick="openLink('https://t.me/amom12358')">تيليجرام</button>
  <button class="btn" onclick="openLink('https://wa.me/201551179084')">احتياطي</button>
  <button class="btn back" onclick="hideAll()">⬅ رجوع</button>
</div>

<div class="footer">
🚀 تم تطوير المنصة بواسطة أدهم<br>
جميع الحقوق محفوظة ©
</div>

</div>

<script>
function enter(){
  document.getElementById("login").style.display="none";
  document.getElementById("home").style.display="block";
}

function toggle(id){
  hideAll();
  document.getElementById(id).style.display="block";
}

function hideAll(){
  document.querySelectorAll('.box').forEach(b => b.style.display="none");
}

function openLink(link){
  window.open(link, "_blank");
}
</script>

</body>
</html>
